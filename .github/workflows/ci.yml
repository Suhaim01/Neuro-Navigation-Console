name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            qtbase5-dev \
            libqt5opengl5-dev

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke navsim
        run: ./scripts/smoke_navsim.sh

      - name: Smoke IgtlReceiver
        run: ./scripts/smoke_igtl_receiver.sh
